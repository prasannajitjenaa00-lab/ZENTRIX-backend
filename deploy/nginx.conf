# /etc/nginx/sites-available/pulse.conf   (certbot --nginx -d pulse.example.com adds the 443 block)
server {
  listen 80; server_name pulse.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2; server_name pulse.example.com;
  # ssl_certificate / ssl_certificate_key are managed by certbot

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;

  root /srv/pulse/current/client/dist;           # React build (same origin as the API => cookies are first-party)
  index index.html;
  location / { try_files $uri /index.html; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  location /api/ {
    client_max_body_size 450m;                    # 400 MB/file; per-file limits are enforced by the app
    proxy_request_buffering off;                  # stream uploads to disk instead of buffering in nginx
    proxy_read_timeout 600s; proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location = /health { proxy_pass http://127.0.0.1:8787/health; }
}
